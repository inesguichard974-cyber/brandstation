<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta charset="UTF-8">
    <title>Studio Labyrinthe - Étiquette</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --label-w: 6cm; 
            --label-h: 6cm;
            --color-fond: #ffffff;
            --color-accent: #f2e8cf; 
            --color-txt-cat: #000000;
            --color-txt-flav: #000000;
            --motif-opacity: 0.4;
            --flavor-size: 20px;
            --dist-logo-bande: 10px;
            --band-padding: 10px;
            --tab-width: 110px;
            --logo-width: 65px;
            --zoom-ecran: 1.2;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; margin: 0; background: #111; color: #eee; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 400px; padding: 25px; background: #1a1a1a; border-right: 1px solid #333; overflow-y: auto; z-index: 20; display: flex; flex-direction: column; }
        .sidebar h2 { color: #2ecc71; font-size: 18px; margin-bottom: 25px; text-align: center; }
        .section { margin-bottom: 15px; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #333; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        
        input[type="range"], input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;
        }

        .row { display: flex; gap: 10px; }
        input[type="color"] { width: 100%; height: 45px; border: none; border-radius: 4px; cursor: pointer; background: none; }

        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px; margin-bottom: 8px; }
        .btn-add { background: #e67e22; color: white; font-size: 14px; }
        .btn-clear { background: #c0392b; color: white; }
        .btn-export { background: #3498db; color: white; }
        .btn-print { background: #27ae60; color: white; height: 50px; font-size: 16px; margin-top: 10px; }

        /* Conteneurs Écran */
        .preview { flex-grow: 1; display: flex; flex-direction: column; background: #0f0f0f; overflow-y: auto; padding: 20px; box-sizing: border-box; gap: 30px; }
        
        .preview-title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 5px; width: 100%; }
        
        .workspace { display: flex; justify-content: center; align-items: center; min-height: 300px; }
        .preview-scaler { transform: scale(var(--zoom-ecran)); transform-origin: center center; }

        /* Grille pour voir la planche s'accumuler en bas à l'écran */
        #sheet-gallery { display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; }
        #sheet-gallery .label-thumb { transform: scale(0.4); transform-origin: top left; width: 2.4cm; height: 2.4cm; margin-right: -3.6cm; margin-bottom: -3.6cm; border: 1px solid #444; }

        /* Structure de l'étiquette unifiée */
        .etiquette-struct {
            width: var(--label-w); height: var(--label-h);
            position: relative; display: flex; flex-direction: column; align-items: center;
            overflow: hidden; box-sizing: border-box; background-color: #fff;
        }

        .background-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('fond-motif.png'); background-size: cover; pointer-events: none; }
        .logo-tab { position: relative; z-index: 10; border-radius: 0 0 100px 100px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .logo-tab::after { content: ""; position: absolute; top: 0; left: 2px; right: 2px; bottom: 2px; border: 1px solid #000000; border-top: none; border-radius: 0 0 98px 98px; pointer-events: none; }
        .logo-tab img { height: auto; margin-top: -5px; z-index: 11; }
        .category-band { position: relative; z-index: 5; width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .category-text { font-weight: 500; letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .flavor-container { position: relative; z-index: 5; flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 0 10px; box-sizing: border-box; }
        .flavor-text { font-weight: 400; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }

        /* Zone invisible à l'écran, dédiée uniquement au moteur d'impression */
        #print-zone { display: none; }

        /* --- CONFIGURATION POUR L'IMPRESSION --- */
        @media print {
            @page { size: A4 portrait; margin: 12mm 10mm; }
            body { background: white !important; color: black !important; height: auto; overflow: visible; }
            .sidebar, .preview { display: none !important; }
            
            #print-zone {
                display: grid !important;
                grid-template-columns: repeat(3, 6cm);
                gap: 8mm;
                justify-content: center;
            }
            #print-zone .etiquette-struct {
                display: flex !important;
                width: 6cm !important; height: 6cm !important;
                border: 1px dashed #bbb;
                page-break-inside: avoid;
                -webkit-print-color-adjust: exact; print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>LABYRINTHE DESIGNER</h2>

    <button class="btn-add" onclick="addToSheet()">📥 AJOUTER À LA PLANCHE</button>
    <button class="btn-clear" onclick="clearSheet()">🗑️ VIDER LA PLANCHE (<span id="count">0</span>)</button>
    
    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMER LA PLANCHE</button>

    <div class="section" style="margin-top:10px;">
        <label>Zoom Aperçu Travail</label>
        <input type="range" id="zoom-in" min="0.8" max="2" step="0.1" value="1.2" oninput="update()">
    </div>

    <div class="section">
        <label>Contenu Étiquette</label>
        <input type="text" id="cat-in" value="THÉ BLANC" oninput="update()">
        <input type="text" id="flav-in" value="GÉRANIUM ROSAT" oninput="update()">
        <label>Taille Police Saveur</label>
        <input type="range" id="size-in" min="12" max="35" value="20" oninput="update()">
    </div>

    <div class="section">
        <label>Couleurs</label>
        <div class="row">
            <div style="flex:1"><label>Fond</label><input type="color" id="bg-in" value="#ffffff" oninput="update()"></div>
            <div style="flex:1"><label>Bande</label><input type="color" id="accent-in" value="#f2e8cf" oninput="update()"></div>
        </div>
        <div class="row" style="margin-top:10px;">
            <div style="flex:1">
                <label>Txt Catégorie</label>
                <select id="txt-cat-color" onchange="update()">
                    <option value="#000000">Noir</option>
                    <option value="#ffffff">Blanc</option>
                </select>
            </div>
            <div style="flex:1">
                <label>Txt Saveur</label>
                <select id="txt-flav-color" onchange="update()">
                    <option value="#000000">Noir</option>
                    <option value="#ffffff">Blanc</option>
                </select>
            </div>
        </div>
    </div>

    <div class="section">
        <label>Dimensions Éléments (Ajustements)</label>
        <label>Largeur Onglet</label>
        <input type="range" id="tab-w-in" min="80" max="150" value="110" oninput="update()">
        <label>Taille du Logo</label>
        <input type="range" id="logo-size-in" min="40" max="90" value="65" oninput="update()">
        <label>Hauteur Bande</label>
        <input type="range" id="band-h-in" min="5" max="30" value="10" oninput="update()">
        <label>Espace Logo <-> Bande</label>
        <input type="range" id="dist-in" min="0" max="50" value="10" oninput="update()">
        <label>Opacité Feuilles</label>
        <input type="range" id="op-in" min="0" max="1" step="0.05" value="0.4" oninput="update()">
    </div>
    
    <button class="btn-export" onclick="exportPNG()">EXPORT PNG UNITAIRE</button>
</div>

<div class="preview">
    <div class="preview-title">Zone de travail (Étiquette en cours d'édition)</div>
    <div class="workspace">
        <div class="preview-scaler">
            <div id="etiquette" class="etiquette-struct">
                <div class="background-pattern"></div>
                <div class="logo-tab">
                    <img src="logo-labyrinthe.png" alt="LOGO">
                </div>
                <div class="category-band">
                    <h1 class="category-text" id="cat-out">THÉ BLANC</h1>
                </div>
                <div class="flavor-container">
                    <div class="flavor-text" id="flav-out">GÉRANIUM ROSAT</div>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-title">Contenu accumulé sur votre feuille A4 (Max 12)</div>
    <div id="sheet-gallery">
        </div>
</div>

<div id="print-zone"></div>

<script>
    // Liste globale stockant les configurations des étiquettes ajoutées
    let savedLabels = [];

    function update() {
        const root = document.documentElement;
        
        root.style.setProperty('--zoom-ecran', document.getElementById('zoom-in').value);
        root.style.setProperty('--color-fond', document.getElementById('bg-in').value);
        root.style.setProperty('--color-accent', document.getElementById('accent-in').value);
        root.style.setProperty('--color-txt-cat', document.getElementById('txt-cat-color').value);
        root.style.setProperty('--color-txt-flav', document.getElementById('txt-flav-color').value);
        root.style.setProperty('--tab-width', document.getElementById('tab-w-in').value + 'px');
        root.style.setProperty('--logo-width', document.getElementById('logo-size-in').value + 'px');
        root.style.setProperty('--band-padding', document.getElementById('band-h-in').value + 'px');
        root.style.setProperty('--dist-logo-bande', document.getElementById('dist-in').value + 'px');
        root.style.setProperty('--motif-opacity', document.getElementById('op-in').value);
        root.style.setProperty('--flavor-size', document.getElementById('size-in').value + 'px');
        
        document.getElementById('cat-out').innerText = document.getElementById('cat-in').value;
        document.getElementById('flav-out').innerText = document.getElementById('flav-in').value;
        
        // Application dynamique des styles à l'élément de travail courant
        applyStylesToElement(document.getElementById('etiquette'));
    }

    function applyStylesToElement(el) {
        if(!el) return;
        el.style.backgroundColor = document.getElementById('bg-in').value;
        
        const pattern = el.querySelector('.background-pattern');
        if(pattern) pattern.style.opacity = document.getElementById('op-in').value;
        
        const tab = el.querySelector('.logo-tab');
        if(tab) {
            tab.style.backgroundColor = document.getElementById('accent-in').value;
            tab.style.width = document.getElementById('tab-w-in').value + 'px';
            tab.style.height = (parseInt(document.getElementById('tab-w-in').value) * 0.95) + 'px';
        }
        
        const img = el.querySelector('.logo-tab img');
        if(img) img.style.width = document.getElementById('logo-size-in').value + 'px';
        
        const band = el.querySelector('.category-band');
        if(band) {
            band.style.backgroundColor = document.getElementById('accent-in').value;
            band.style.marginTop = document.getElementById('dist-in').value + 'px';
            band.style.padding = document.getElementById('band-h-in').value + 'px 0';
        }
        
        const catTxt = el.querySelector('.category-text');
        if(catTxt) {
            catTxt.style.color = document.getElementById('txt-cat-color').value;
            catTxt.innerText = document.getElementById('cat-in').value;
        }
        
        const flavTxt = el.querySelector('.flavor-text');
        if(flavTxt) {
            flavTxt.style.color = document.getElementById('txt-flav-color').value;
            flavTxt.style.fontSize = document.getElementById('size-in').value + 'px';
            flavTxt.innerText = document.getElementById('flav-in').value;
        }
    }

    function addToSheet() {
        if(savedLabels.length >= 12) {
            alert("La planche A4 est pleine (maximum 12 étiquettes de 6x6 cm).");
            return;
        }

        // Cloner l'étiquette de travail courante
        const original = document.getElementById('etiquette');
        const clone = original.cloneNode(true);
        clone.removeAttribute('id'); 
        
        // Fixer ses styles inline pour qu'elle ne bouge plus lors des prochaines modifications
        applyStylesToElement(clone);

        // Sauvegarder dans notre tableau
        savedLabels.push(clone);
        
        // Mettre à jour l'affichage
        renderSheet();
    }

    function renderSheet() {
        const gallery = document.getElementById('sheet-gallery');
        const printZone = document.getElementById('print-zone');
        
        gallery.innerHTML = "";
        printZone.innerHTML = "";
        
        document.getElementById('count').innerText = savedLabels.length;

        savedLabels.forEach(labelNode => {
            // Ajouter à la zone d'impression réelle
            const printClone = labelNode.cloneNode(true);
            printZone.appendChild(printClone);
            
            // Créer une miniature pour l'écran
            const thumbContainer = document.createElement('div');
            thumbContainer.classList.add('label-thumb');
            const thumbClone = labelNode.cloneNode(true);
            thumbContainer.appendChild(thumbClone);
            gallery.appendChild(thumbContainer);
        });
    }

    function clearSheet() {
        savedLabels = [];
        renderSheet();
    }

    function exportPNG() {
        const element = document.getElementById('etiquette');
        html2canvas(element, { 
            scale: 5, 
            backgroundColor: null,
            useCORS: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = document.getElementById('flav-in').value + '.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });
    }

    // Initialisation
    update();
</script>

</body>
</html>
